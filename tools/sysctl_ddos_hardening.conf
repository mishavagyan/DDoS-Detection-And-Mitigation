# Host-level network hardening for Linux DDoS resilience.
# Review and tune values for your workload before production rollout.

net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 8192

# Moderate handling for ICMP floods while keeping diagnostics usable.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Keep conntrack behavior predictable under pressure.
net.netfilter.nf_conntrack_tcp_loose = 1
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30
